# =====================================================================
# Nginx config for "Мечты добрых сердец" (бэкенд + статический фронт)
#
# Структура:
#   - Фронтенд (Vite build) обслуживается как статика из /var/www/mds-site
#   - Бэкенд (Express API) проксируется с /api на http://127.0.0.1:8080
#
# Замените server_name на ваш реальный домен и подключите HTTPS через
# certbot:  sudo certbot --nginx -d example.com -d www.example.com
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # После получения сертификата certbot заменит этот блок и добавит
    # перенаправление на HTTPS автоматически.

    root /var/www/mds-site;
    index index.html;

    # ----- Фронтенд (SPA) -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- robots.txt и sitemap.xml -----
    location = /robots.txt   { access_log off; log_not_found off; }
    location = /sitemap.xml  { access_log off; log_not_found off; }

    # ----- API -----
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ----- Кэш статических файлов -----
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Размер запросов (загрузка фото в админке через base64 / multipart)
    client_max_body_size 20m;
}
